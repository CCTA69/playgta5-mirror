<style>
#game-tools{position:fixed;left:12px;bottom:12px;z-index:10005;display:flex;gap:6px;font:14px system-ui}
#game-tools a,#game-tools button{box-sizing:border-box;background:#182621e8;color:#fff;padding:10px 14px;border:1px solid #789184;border-radius:24px;min-height:44px;font:inherit;text-decoration:none;cursor:pointer}
html.game-tools-hidden [data-game-overlay],html.game-tools-hidden #game-help{display:none!important}
html.game-tools-hidden #game-tools button{opacity:.5}
</style>
<div id="game-tools"><a id="game-help" href="/__support/" target="_blank" rel="noopener">Help / browser checks</a><button id="game-tools-toggle" type="button" aria-label="Hide extra controls (F8)" aria-pressed="false">Hide · F8</button></div>
<script>
(() => {
  const button = document.getElementById('game-tools-toggle');
  function setHidden(hidden) {
    document.documentElement.classList.toggle('game-tools-hidden', hidden);
    button.textContent = hidden ? 'Tools · F8' : 'Hide · F8';
    button.setAttribute('aria-pressed', String(hidden));
    button.setAttribute('aria-label', (hidden ? 'Show' : 'Hide') + ' extra controls (F8)');
    dispatchEvent(new CustomEvent('game-tools-visibility', {detail:{hidden}}));
    try { sessionStorage.setItem('playgta5.toolsHidden', String(hidden)); } catch {}
  }
  const toggle = () => setHidden(!document.documentElement.classList.contains('game-tools-hidden'));
  button.onclick = toggle;
  for (const type of ['keydown', 'keyup']) addEventListener(type, e => {
    if (e.code !== 'F8') return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (type === 'keydown' && !e.repeat) toggle();
  }, true);
  try { setHidden(sessionStorage.getItem('playgta5.toolsHidden') === 'true'); } catch {}
})();
</script>
